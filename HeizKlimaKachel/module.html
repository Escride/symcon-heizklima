<style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { font-family: var(--font-family, system-ui, -apple-system, "Segoe UI", sans-serif); }
    #tile { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--content-color, #000); }
    #bgcolor, #bgimg { position: absolute; inset: 0; pointer-events: none; }
    #bgimg { background-repeat: no-repeat; display: none; }
    #name { position: absolute; z-index: 2; max-width: calc(100% - 24px); pointer-events: none; }
    #elements { position: absolute; inset: 0; }
    .element { position: absolute; z-index: 1; }
    .bar { position: absolute; left: 50%; top: 50%; margin: 0; width: 100%; height: 2.25rem; border-radius: .65rem; overflow: hidden;
           background: rgba(128,128,128,.28); }
    .bar.vertical { width: 2.5rem; height: 9rem; margin: 0; }
    .bar.arc { height: auto; aspect-ratio: 1; overflow: visible; background: transparent; }
    .fill { position: absolute; inset: 0; transform-origin: left center; clip-path: inset(0 100% 0 0); }
    .bar.vertical .fill { clip-path: inset(100% 0 0 0); }
    .arc-meter { display: none; position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .arc-track, .arc-progress { fill: none; stroke-width: 8; }
    .arc-track { stroke: rgba(128,128,128,.28); }
    .arc-progress { stroke-linecap: round; }
    .bar.arc .arc-meter { display: block; }
    .bar.arc .fill { display: none; }
    .bar-text { position: absolute; z-index: 2; inset: 0; display: flex; align-items: center; justify-content: space-between;
                gap: .5rem; padding: 0 .75rem; color: #000; font-size: .875rem; pointer-events: none; }
    .bar.arc .bar-text { inset: auto; width: 84%; flex-direction: column; justify-content: center;
                         gap: .1rem; padding: .25rem; text-align: center; }
    .bar.vertical .bar-text { flex-direction: column-reverse; justify-content: space-between; padding: .5rem .15rem; }
    .readout { display: inline-flex; align-items: baseline; justify-content: center; gap: .45em; white-space: nowrap; }
    .readout.external { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%);
                        pointer-events: none; }
    .readout-value { font-weight: 600; font-variant-numeric: tabular-nums; }
    .styled-text { position: relative; z-index: 0; isolation: isolate; border-radius: 4px; }
    .styled-text::before { content: ""; position: absolute; z-index: -2; inset: -2px -5px;
                           border: var(--text-border-width, 0px) solid var(--text-border-color, transparent);
                           border-radius: inherit; background-color: var(--text-background, transparent); pointer-events: none; }
    .styled-text::after { content: ""; position: absolute; z-index: -1; inset: -2px -5px;
                          border-radius: inherit; background-image: var(--text-image, none);
                          background-size: cover; background-position: center;
                          opacity: var(--text-image-opacity, 1); pointer-events: none; }
    .target .bar { touch-action: none; cursor: pointer; }
    .target.disabled .bar { cursor: default; }
    .thumb { position: absolute; z-index: 1; top: 4px; bottom: 4px; width: 5px; border-radius: 3px;
             background: #fff; box-shadow: 0 0 4px rgba(0,0,0,.35); pointer-events: none; }
    .bar.vertical .thumb { top: auto; left: 4px; right: 4px; width: auto; height: 5px; }
    .bar.arc .thumb { display: none; }
</style>

<div id="tile">
    <div id="bgcolor"></div>
    <div id="bgimg"></div>
    <div id="name" class="styled-text"></div>
    <div id="elements"></div>
</div>

<script>
(function () {
    let cfg = null;
    let vals = {};
    let activeDrag = null;
    const elementsByKey = {};
    const $ = id => document.getElementById(id);
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const isNum = value => typeof value === 'number' && Number.isFinite(value);
    const fmt = (value, digits) => value.toLocaleString('de-DE', {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
    });
    const showValue = value => isNum(value) ? fmt(value, Number.isInteger(value) ? 0 : 1) : '–';

    function mixColors(first, second) {
        const a = parseInt(first.slice(1), 16);
        const b = parseInt(second.slice(1), 16);
        const part = shift => Math.round((((a >> shift) & 255) + ((b >> shift) & 255)) / 2)
            .toString(16).padStart(2, '0');
        return '#' + part(16) + part(8) + part(0);
    }

    function applyTextStyle(node, style) {
        if (!style) return;
        node.classList.add('styled-text');
        node.style.color = style.color || '#000';
        node.style.fontFamily = style.fontFamily || '';
        node.style.fontSize = clamp(isNum(style.fontSize) ? style.fontSize : .875, .5, 3) + 'rem';
        node.style.setProperty('--text-background', style.backgroundColor || 'transparent');
        node.style.setProperty('--text-border-width', clamp(style.borderWidth || 0, 0, 12) + 'px');
        node.style.setProperty('--text-border-color', style.borderColor || 'transparent');
        const image = style.image || {};
        node.style.setProperty('--text-image', image.src ? 'url("' + image.src + '")' : 'none');
        node.style.setProperty('--text-image-opacity', String(clamp(
            isNum(image.opacity) ? image.opacity : 100, 0, 100) / 100));
    }

    function setNamePosition() {
        const name = $('name');
        const x = isNum(cfg.nameOffsetX) ? cfg.nameOffsetX : 0;
        const y = isNum(cfg.nameOffsetY) ? cfg.nameOffsetY : 0;
        name.style.top = name.style.right = name.style.bottom = name.style.left = '';
        name.style.transform = '';
        switch (cfg.namePosition) {
            case 'top-right':
                name.style.top = 'calc(12px + ' + y + 'px)';
                name.style.right = 'calc(12px - ' + x + 'px)';
                break;
            case 'bottom-left':
                name.style.bottom = 'calc(12px - ' + y + 'px)';
                name.style.left = 'calc(12px + ' + x + 'px)';
                break;
            case 'bottom-right':
                name.style.bottom = 'calc(12px - ' + y + 'px)';
                name.style.right = 'calc(12px - ' + x + 'px)';
                break;
            case 'center':
                name.style.top = 'calc(50% + ' + y + 'px)';
                name.style.left = 'calc(50% + ' + x + 'px)';
                name.style.transform = 'translate(-50%, -50%)';
                break;
            default:
                name.style.top = 'calc(12px + ' + y + 'px)';
                name.style.left = 'calc(12px + ' + x + 'px)';
        }
    }

    function applyBackground() {
        $('bgcolor').style.background = cfg.bgColor
            ? 'rgba(' + parseInt(cfg.bgColor.slice(1, 3), 16) + ',' +
                parseInt(cfg.bgColor.slice(3, 5), 16) + ',' +
                parseInt(cfg.bgColor.slice(5, 7), 16) + ',' + clamp(cfg.bgOpacity, 0, 100) / 100 + ')'
            : 'transparent';
        const image = cfg.image || {};
        const node = $('bgimg');
        node.style.display = image.src ? 'block' : 'none';
        node.style.opacity = clamp(image.opacity, 0, 100) / 100;
        node.style.backgroundImage = image.src ? 'url("' + image.src + '")' : 'none';
        node.style.top = node.style.right = node.style.bottom = node.style.left = 'auto';
        node.style.width = node.style.height = '';
        node.style.transform = '';
        if (!image.src) return;
        if (image.pos === 'full') {
            node.style.inset = '0';
            node.style.backgroundSize = 'cover';
            node.style.backgroundPosition = 'center';
            return;
        }
        node.style.width = node.style.height = clamp(image.size, 5, 100) + '%';
        node.style.backgroundSize = 'contain';
        const positions = {
            'top-left': ['0', 'auto', 'auto', '0', 'left top'],
            'top-right': ['0', '0', 'auto', 'auto', 'right top'],
            'bottom-left': ['auto', 'auto', '0', '0', 'left bottom'],
            'bottom-right': ['auto', '0', '0', 'auto', 'right bottom'],
            center: ['50%', 'auto', 'auto', '50%', 'center']
        };
        const position = positions[image.pos] || positions.center;
        [node.style.top, node.style.right, node.style.bottom, node.style.left, node.style.backgroundPosition] = position;
        if (image.pos === 'center') node.style.transform = 'translate(-50%, -50%)';
    }

    function makeElement(key, element) {
        const root = document.createElement('div');
        root.className = 'element' + (element.target ? ' target' : '');
        root.id = 'element-' + key;
        root.dataset.key = key;
        const readout = document.createElement('div');
        readout.className = 'readout styled-text';
        readout.id = 'readout-' + key;
        const readoutLabel = document.createElement('span');
        readoutLabel.className = 'readout-label';
        readoutLabel.id = 'readout-label-' + key;
        const readoutValue = document.createElement('span');
        readoutValue.className = 'readout-value';
        readoutValue.id = 'readout-value-' + key;
        readout.append(readoutLabel, readoutValue);
        root.appendChild(readout);

        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.id = 'bar-' + key;
        const fill = document.createElement('div');
        fill.className = 'fill';
        fill.id = 'fill-' + key;
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'arc-meter');
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('aria-hidden', 'true');
        const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
        gradient.setAttribute('id', 'arc-gradient-' + key);
        gradient.setAttribute('x1', '0');
        gradient.setAttribute('y1', '0');
        gradient.setAttribute('x2', '100');
        gradient.setAttribute('y2', '0');
        gradient.setAttribute('gradientUnits', 'userSpaceOnUse');
        const stops = [0, 50, 100].map(function () {
            return document.createElementNS('http://www.w3.org/2000/svg', 'stop');
        });
        stops.forEach(stop => gradient.appendChild(stop));
        defs.appendChild(gradient);
        const track = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        track.setAttribute('class', 'arc-track');
        track.setAttribute('pathLength', '100');
        const progress = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        progress.setAttribute('class', 'arc-progress');
        progress.setAttribute('pathLength', '100');
        svg.append(defs, track, progress);
        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        thumb.id = 'thumb-' + key;
        const text = document.createElement('div');
        text.className = 'bar-text';
        const label = document.createElement('span');
        label.className = 'element-label';
        label.id = 'bar-label-' + key;
        const value = document.createElement('span');
        value.className = 'element-value';
        value.id = 'bar-value-' + key;
        text.append(label, value);
        bar.append(fill, svg, thumb, text);
        root.appendChild(bar);
        $('elements').appendChild(root);
        elementsByKey[key] = root;
    }

    function arcPath(start, sweep) {
        const point = angle => {
            const radians = angle * Math.PI / 180;
            return [50 + 43 * Math.sin(radians), 50 - 43 * Math.cos(radians)];
        };
        const from = point(start);
        const to = point(start + sweep);
        return 'M ' + from[0] + ' ' + from[1] + ' A 43 43 0 ' +
            (Math.abs(sweep) > 180 ? 1 : 0) + ' ' + (sweep >= 0 ? 1 : 0) + ' ' + to[0] + ' ' + to[1];
    }

    function progressFor(element, value) {
        if (!isNum(value)) return 0;
        return element.rangeMax > element.rangeMin
            ? clamp((value - element.rangeMin) / (element.rangeMax - element.rangeMin) * 100, 0, 100)
            : 0;
    }

    function renderBar(key, element, value, showLabel) {
        const root = elementsByKey[key];
        const bar = $('bar-' + key);
        const readout = $('readout-' + key);
        const textOnly = element.shape === 'text';
        bar.style.display = textOnly ? 'none' : '';
        const vertical = element.orientation === 'vertical';
        const arc = element.shape === 'arc';
        const textPosition = element.textPosition || 'inside';
        const externalText = !textOnly && !arc && textPosition !== 'inside';
        bar.classList.toggle('vertical', vertical && !arc);
        bar.classList.toggle('arc', arc);
        const angle = clamp(isNum(element.angle) ? element.angle : 0, -90, 90);
        bar.style.transform = 'translate(-50%, -50%) rotate(' + (arc ? 0 : angle) + 'deg)';
        readout.classList.toggle('external', externalText);
        readout.style.display = textOnly || externalText ? 'inline-flex' : 'none';
        bar.querySelector('.bar-text').style.display = externalText ? 'none' : '';
        const width = clamp(element.width || 78, 10, 100);
        if (textOnly) {
            root.style.width = 'auto';
            root.style.height = 'auto';
        } else {
            const tileWidth = $('tile').clientWidth;
            const tileHeight = $('tile').clientHeight;
            const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
            const barWidth = arc
                ? tileWidth * width / 100
                : vertical ? 2.5 * rem : tileWidth * width / 100;
            const barHeight = arc
                ? barWidth
                : vertical ? tileHeight * width / 100 : 2.25 * rem;
            const radians = (arc ? 0 : angle) * Math.PI / 180;
            const boundsWidth = Math.abs(Math.cos(radians)) * barWidth +
                Math.abs(Math.sin(radians)) * barHeight;
            const boundsHeight = Math.abs(Math.sin(radians)) * barWidth +
                Math.abs(Math.cos(radians)) * barHeight;
            root.style.width = boundsWidth + 'px';
            root.style.height = boundsHeight + 'px';
            bar.style.width = barWidth + 'px';
            bar.style.height = barHeight + 'px';
        }
        bar.style.border = clamp(element.borderWidth || 0, 0, 12) + 'px solid ' +
            (element.borderColor || 'transparent');
        const low = element.lowColor || '#3B82F6';
        const high = element.highColor || '#F97316';
        const mid = element.rangeMax > element.rangeMin
            ? clamp((element.mid - element.rangeMin) / (element.rangeMax - element.rangeMin) * 100, 0, 100)
            : 50;
        const midColor = mixColors(low, high);
        const gradientDirection = vertical ? '0deg' : '90deg';
        const gradient = 'linear-gradient(' + gradientDirection + ',' + low + ' 0%,' +
            midColor + ' ' + mid + '%,' + high + ' 100%)';
        const fill = $('fill-' + key);
        fill.style.background = gradient;
        const progressRange = element.target
            ? { rangeMin: element.controlMin, rangeMax: element.controlMax }
            : element;
        const percent = progressFor(progressRange, value);
        fill.style.clipPath = vertical
            ? 'inset(' + (100 - percent) + '% 0 0 0)'
            : 'inset(0 ' + (100 - percent) + '% 0 0)';
        const start = clamp(element.start || 0, 0, 359);
        const sweep = clamp(isNum(element.sweep) ? element.sweep : 180, -359, 359);
        const path = arcPath(start, sweep);
        const track = bar.querySelector('.arc-track');
        const arcFill = bar.querySelector('.arc-progress');
        const gradientStops = bar.querySelectorAll('linearGradient stop');
        gradientStops[0].setAttribute('offset', '0%');
        gradientStops[0].setAttribute('stop-color', low);
        gradientStops[1].setAttribute('offset', mid + '%');
        gradientStops[1].setAttribute('stop-color', midColor);
        gradientStops[2].setAttribute('offset', '100%');
        gradientStops[2].setAttribute('stop-color', high);
        track.setAttribute('d', path);
        arcFill.setAttribute('d', path);
        arcFill.style.stroke = 'url(#arc-gradient-' + key + ')';
        arcFill.style.strokeDasharray = '100 100';
        arcFill.style.strokeDashoffset = String(100 - percent);
        const thumb = $('thumb-' + key);
        if (arc || !element.target) {
            thumb.style.display = 'none';
        } else if (vertical) {
            thumb.style.display = '';
            thumb.style.bottom = 'calc(' + percent + '% - ' + (percent * .06) + 'px)';
        } else {
            thumb.style.display = '';
            thumb.style.left = 'calc(' + percent + '% - ' + (percent * .06) + 'px)';
        }
        const labelText = showLabel ? element.label : '';
        const valueText = showValue(value);
        $('bar-label-' + key).textContent = labelText;
        $('bar-value-' + key).textContent = valueText;
        $('readout-label-' + key).textContent = labelText;
        $('readout-value-' + key).textContent = valueText;
        const text = bar.querySelector('.bar-text');
        const offsetX = isNum(element.textOffsetX) ? element.textOffsetX : 0;
        const offsetY = isNum(element.textOffsetY) ? element.textOffsetY : 0;
        if (arc) {
            const middleAngle = (start + sweep / 2) * Math.PI / 180;
            const textX = 50 + 20 * Math.sin(middleAngle);
            const textY = 50 - 20 * Math.cos(middleAngle);
            text.style.left = textX + '%';
            text.style.top = textY + '%';
            text.style.right = text.style.bottom = 'auto';
            text.style.transform = 'translate(calc(-50% + ' + offsetX + 'px), calc(-50% + ' +
                offsetY + 'px))';
        } else {
            text.style.left = text.style.top = text.style.right = text.style.bottom = '';
            text.style.transform = 'translate(' + offsetX + 'px, ' + offsetY + 'px)';
        }
        if (externalText) {
            const barWidth = bar.offsetWidth;
            const barHeight = bar.offsetHeight;
            const axis = vertical
                ? [-Math.sin(angle * Math.PI / 180), Math.cos(angle * Math.PI / 180)]
                : [Math.cos(angle * Math.PI / 180), Math.sin(angle * Math.PI / 180)];
            const normal = [-axis[1], axis[0]];
            let direction;
            let distance;
            if (textPosition === 'above' || textPosition === 'below') {
                const sign = textPosition === 'above' ? -1 : 1;
                if (vertical) {
                    direction = axis;
                    distance = barHeight / 2 + 6;
                } else {
                    direction = normal;
                    distance = barHeight / 2 + 6;
                }
                direction = [direction[0] * sign, direction[1] * sign];
            } else {
                if (vertical) {
                    direction = normal;
                    distance = barWidth / 2 + 6;
                    const sign = textPosition === 'left' ? 1 : -1;
                    direction = [direction[0] * sign, direction[1] * sign];
                } else {
                    direction = axis;
                    distance = barWidth / 2 + 6;
                    const sign = textPosition === 'left' ? -1 : 1;
                    direction = [direction[0] * sign, direction[1] * sign];
                }
            }
            readout.style.left = 'calc(50% + ' + (direction[0] * distance + offsetX) + 'px)';
            readout.style.top = 'calc(50% + ' + (direction[1] * distance + offsetY) + 'px)';
            const followsBar = textPosition === 'left' || textPosition === 'right';
            const rotation = followsBar ? angle + (vertical ? 90 : 0) : 0;
            const readableRotation = ((rotation + 90) % 180 + 180) % 180 - 90;
            readout.style.transform = 'translate(-50%, -50%) rotate(' + readableRotation + 'deg)';
        } else {
            readout.style.left = '';
            readout.style.top = '';
            readout.style.transform = '';
        }
        applyTextStyle($('bar-label-' + key), element.styles && element.styles.label);
        applyTextStyle($('bar-value-' + key), element.styles && element.styles.value);
        applyTextStyle($('readout-label-' + key), element.styles && element.styles.label);
        applyTextStyle($('readout-value-' + key), element.styles && element.styles.value);
    }

    function renderElement(key, element) {
        const root = elementsByKey[key];
        root.classList.toggle('target', !!element.target);
        root.style.display = element.available ? '' : 'none';
        root.style.left = clamp(element.x, 0, 100) + '%';
        root.style.top = clamp(element.y, 0, 100) + '%';
        if (!element.available) return;
        root.style.width = element.shape === 'text' ? 'auto' : '';
        root.style.height = '';
        root.classList.toggle('disabled', element.target && (
            !element.controllable || vals.permissionAllowed === false ||
            element.shape === 'text'));
        const value = activeDrag && activeDrag.key === key ? activeDrag.value : vals[element.valueKey];
        renderBar(key, element, value, true);
    }

    function configureTarget(key, element) {
        if (!element.target) return;
        const bar = $('bar-' + key);
        const root = elementsByKey[key];
        const canControl = element.controllable && element.shape !== 'text' &&
            vals.permissionAllowed !== false;
        if (!canControl || !element.available) {
            root.classList.add('disabled');
            bar.style.pointerEvents = 'none';
            return;
        }
        root.classList.remove('disabled');
        bar.style.pointerEvents = 'auto';
        const fromEvent = event => {
            const rect = bar.getBoundingClientRect();
            let fraction;
            if (element.shape === 'arc') {
                const dx = event.clientX - (rect.left + rect.width / 2);
                const dy = event.clientY - (rect.top + rect.height / 2);
                const angle = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
                const start = ((element.start % 360) + 360) % 360;
                const sweep = isNum(element.sweep) ? element.sweep : 180;
                const distance = sweep < 0
                    ? (start - angle + 360) % 360
                    : (angle - start + 360) % 360;
                fraction = Math.abs(sweep) > 0
                    ? clamp(distance / Math.abs(sweep), 0, 1)
                    : 0;
            } else {
                const angle = clamp(isNum(element.angle) ? element.angle : 0, -90, 90) * Math.PI / 180;
                const dx = event.clientX - (rect.left + rect.width / 2);
                const dy = event.clientY - (rect.top + rect.height / 2);
                const localX = Math.cos(angle) * dx + Math.sin(angle) * dy;
                const localY = -Math.sin(angle) * dx + Math.cos(angle) * dy;
                fraction = element.orientation === 'vertical'
                    ? clamp((bar.offsetHeight / 2 - localY) / bar.offsetHeight, 0, 1)
                    : clamp((localX + bar.offsetWidth / 2) / bar.offsetWidth, 0, 1);
            }
            const min = element.controlMin;
            const max = element.controlMax;
            const step = element.step > 0 ? element.step : 1;
            const value = min + fraction * (max - min);
            return clamp(min + Math.round((value - min) / step) * step, min, max);
        };
        bar.onpointerdown = event => {
            if (event.button !== 0) return;
            activeDrag = { key: key, pointerId: event.pointerId, value: fromEvent(event) };
            bar.setPointerCapture(event.pointerId);
            renderElement(key, element);
            event.preventDefault();
        };
        bar.onpointermove = event => {
            if (!activeDrag || activeDrag.key !== key) return;
            if (activeDrag.pointerId !== event.pointerId) return;
            activeDrag.value = fromEvent(event);
            renderElement(key, element);
        };
        bar.onpointerup = event => {
            if (!activeDrag || activeDrag.key !== key) return;
            if (activeDrag.pointerId !== event.pointerId) return;
            const value = activeDrag.value;
            activeDrag = null;
            if (typeof requestAction === 'function') requestAction('setTarget:' + key, value);
            renderElement(key, element);
            if (bar.hasPointerCapture(event.pointerId)) bar.releasePointerCapture(event.pointerId);
        };
        bar.onpointercancel = () => {
            activeDrag = null;
            renderElement(key, element);
        };
    }

    function render() {
        if (!cfg || !cfg.elements) return;
        $('name').textContent = cfg.name || '';
        applyTextStyle($('name'), cfg.textStyles.name);
        setNamePosition();
        applyBackground();
        Object.keys(cfg.elements).forEach(function (key) {
            const element = cfg.elements[key];
            if (!elementsByKey[key]) makeElement(key, element);
            renderElement(key, element);
            configureTarget(key, element);
        });
    }

    window.addEventListener('resize', render);

    window.handleMessage = function (message) {
        const data = typeof message === 'string' ? JSON.parse(message) : message;
        if (data.config) cfg = data.config;
        if (data.values) vals = data.values;
        render();
    };
})();
</script>
